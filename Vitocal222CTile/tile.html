<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vitocal 222-C</title>
<style>
:root{color-scheme:dark;--bg:#061522;--panel:#0b2234;--line:#20455c;--text:#ecf5fb;--muted:#9cbace;--blue:#51c7ff;--warm:#ffbc70;--green:#57e2af}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#11334a,var(--bg) 70%);color:var(--text);font:15px/1.4 system-ui,sans-serif}html,body{width:100%;height:100%;overflow:hidden}body{position:relative}main{position:absolute;top:0;left:50%;width:calc(100% / var(--tile-scale,1));max-width:none;padding:22px;margin:0;transform-origin:top center;transform:translateX(-50%) scale(var(--tile-scale,1))}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}h1{margin:0;font-size:clamp(18px,2.5vw,26px);letter-spacing:-.4px;line-height:1.2;overflow-wrap:anywhere}h2{font-size:18px;margin:0 0 15px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted)}.device-heading{display:flex;align-items:center;gap:12px;min-width:0}.heading-copy{min-width:0}.device-heading .eyebrow{font-size:9px;letter-spacing:1px;margin-bottom:4px}.badge{border:1px solid var(--line);border-radius:24px;padding:9px 15px;color:var(--green);max-width:45%;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid var(--line);background:linear-gradient(140deg,#0d293e,#081b2b);border-radius:18px;padding:20px;min-width:0}.wide{grid-column:1/-1}.reading{background:#071927;border:1px solid var(--line);border-radius:12px;padding:16px}.label{color:var(--muted);font-size:13px}.value{font-size:clamp(24px,4vw,38px);font-weight:600;letter-spacing:-1px;overflow-wrap:anywhere}.warm{color:var(--warm)}.cold{color:var(--blue)}.status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.status{background:#071927;border-radius:12px;padding:14px;border:1px solid var(--line)}.status strong{overflow-wrap:anywhere;display:block;font-size:19px;margin-top:6px}.status[data-active="true"]{border-color:#287c63}.status[data-active="true"] strong{color:var(--green)}button{font:inherit;border-radius:9px;border:1px solid #376079;padding:10px 12px;background:#0d3047;color:var(--text);cursor:pointer;min-height:42px}button:disabled{opacity:.45;cursor:default}button:hover:enabled{border-color:var(--blue)}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.reason,.hint{font-size:12px;color:var(--muted);margin-top:10px}.feedback{font-size:13px;color:#ffd399;min-height:20px;margin:12px 0}footer{color:var(--muted);font-size:9px;margin-top:14px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}details{margin-top:15px;color:var(--muted);font-size:12px}summary{cursor:pointer}.unavailable{color:#ffd399} @media(max-width:650px){main{padding:12px}.grid{grid-template-columns:1fr}.status-grid{grid-template-columns:1fr 1fr}.reading{padding:10px}.panel{padding:15px}.value{font-size:25px}.label{font-size:11px}.badge{font-size:12px}header{align-items:flex-start;gap:12px}.device-heading{gap:8px}}

.section-heading,.dialog-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.section-heading h2{margin-bottom:0}.section-heading{margin-bottom:18px}.temperature-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.reading{text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}.reading .value{font-size:clamp(22px,3vw,34px)}.chart-link{color:var(--muted);font-size:11px}dialog{color:var(--text);background:#0a1d2c;border:1px solid #36627a;border-radius:18px;padding:22px;width:min(950px,96vw);max-width:96vw;max-height:95dvh;overflow:auto}dialog::backdrop{background:#000a}.dialog-heading h2{font-size:24px;margin:4px 0 15px}select{font:inherit;background:#102e42;border:1px solid #376079;border-radius:8px;color:var(--text);padding:9px;margin-left:6px}.history-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:12px 0}.history-navigation{display:flex;gap:7px;flex-wrap:wrap}.history-dates{font-size:13px;color:var(--muted);margin:12px 0}#historyState{font-size:13px;color:#ffd399;min-height:24px}#chartWrap{position:relative}#historyChart{display:block;width:100%;height:auto;min-height:160px;touch-action:pan-y}#chartTooltip{position:absolute;left:10px;top:4px;background:#183e55;padding:8px;border-radius:7px;pointer-events:none;font-size:12px}#historySummary{margin-top:8px}.table-scroll{max-height:240px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line)}#historyChart text{fill:#9fbfd3;font:12px system-ui}.chart-grid{stroke:#244257;stroke-width:1}.chart-line{stroke:#ffbc70;stroke-width:2;fill:none;vector-effect:non-scaling-stroke}.chart-point,.chart-bar{fill:#ffbc70}
@media(max-width:650px){.temperature-cards{grid-template-columns:1fr 1fr;gap:8px}.reading .value{font-size:26px}.dialog-heading h2{font-size:20px}dialog{padding:14px}.history-navigation button{padding:8px}.section-heading .hint{margin:0}}

@media(max-height:450px){main{padding:10px}header{margin-bottom:10px}.grid{gap:10px}.panel{padding:12px}.section-heading{margin-bottom:10px}h2{margin-bottom:10px}.reading{padding:10px;gap:2px}.status{padding:8px}.status strong{margin-top:2px}.feedback:empty{display:none}footer{margin-top:8px}}
.energy-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.energy-value{color:#79dfbc}.energy-note{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.energy-note:empty{display:none}@media(max-width:650px){.energy-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.energy-card:last-child{grid-column:1/-1}}
.control-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.control-grid label{display:flex;flex-direction:column;gap:8px}.control-grid input,.control-grid select{width:100%;min-width:0;margin:0;background:#102e42;color:var(--text);font:inherit;padding:10px;border:1px solid #376079;border-radius:8px}.control-grid button{margin-top:10px}.mode-choices[hidden]{display:none}.mode-choices{display:flex;flex-wrap:wrap;gap:8px}.mode-choices button{margin-top:8px;overflow-wrap:anywhere;text-align:left}.mode-choices button[aria-pressed="true"]{background:#165441;border-color:var(--green);color:var(--green)}.control-note{color:var(--muted);font-size:12px}@media(max-width:650px){.control-grid{grid-template-columns:1fr}}
</style></head><body><main>
<header><div class="device-heading">

<div class="heading-copy"><div class="eyebrow">VIESSMANN · WÄRMEPUMPE</div><h1>Vitocal 222-C</h1></div></div><div id="modeBadge" class="badge">—</div></header>
<div class="grid"><section class="panel wide"><div class="section-heading"><h2>Isttemperaturen</h2><span class="hint">Temperatur anklicken → Verlauf</span></div>
<div class="temperature-cards">
<button class="reading" data-history="primaryFlow"><span class="label">Vorlauf Primärquelle</span><span id="primaryFlow" class="value cold">—</span><span class="chart-link">Verlauf öffnen</span></button>
<button class="reading" data-history="flow"><span class="label">Vorlauf Sekundär</span><span id="flow" class="value warm">—</span><span class="chart-link">Verlauf öffnen</span></button>
<button class="reading" data-history="return"><span class="label">Rücklauf Sekundär</span><span id="return" class="value cold">—</span><span class="chart-link">Verlauf öffnen</span></button>
<button class="reading" data-history="water"><span class="label">Warmwasser Ist</span><span id="water" class="value warm">—</span><span class="chart-link">Verlauf öffnen</span></button>
</div>
</section>
<section class="panel wide"><div class="section-heading"><h2>Strom &amp; Verbrauch</h2><span class="hint">Wert anklicken → Verlauf</span></div><div class="energy-cards">
<button class="reading energy-card" data-history="power"><span class="label">Momentanleistung · elektrisch</span><span id="power" class="value energy-value">—</span><span id="powerReason" class="energy-note"></span><span class="chart-link">Verlauf öffnen</span></button>
<button class="reading energy-card" data-history="total"><span class="label">Gesamtverbrauch · Stromzähler</span><span id="total" class="value energy-value">—</span><span id="totalReason" class="energy-note"></span><span class="chart-link">Verlauf öffnen</span></button>
<button class="reading energy-card" data-history="month"><span id="monthCaption" class="label">Monatsverbrauch</span><span id="month" class="value energy-value">—</span><span id="monthReason" class="energy-note"></span><span class="chart-link">Verlauf öffnen</span></button>
</div></section>
<section class="panel wide"><h2>Heizung einstellen</h2><div class="control-grid"><div><div id="modeLabel">Betriebsart Heizung</div><div id="modeChoices" class="mode-choices" role="group" aria-labelledby="modeLabel"></div><label><input id="modeInput" type="text" maxlength="100" aria-label="Betriebsart als Variablenwert" hidden></label><div id="modeReason" class="control-note"></div><button id="applyMode">Betriebsart übernehmen</button></div><div><label>Raumsolltemperatur (°C)<select id="roomTargetInput" required></select></label><div id="roomTargetCurrent" class="control-note"></div><div id="roomTargetReason" class="control-note"></div><button id="applyRoomTarget">Temperatur übernehmen</button></div><div><label>Warmwasser-Solltemperatur (°C)<select id="waterTargetInput" required></select></label><div id="waterTargetCurrent" class="control-note"></div><div id="waterTargetReason" class="control-note"></div><button id="applyWaterTarget">Temperatur übernehmen</button></div></div></section>
<section class="panel wide"><h2>Anlagenstatus</h2><div id="statuses" class="status-grid"></div></section>
</div>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div><footer><span id="sourceState"></span><span id="updated"></span></footer>
</main>
<dialog id="historyDialog" aria-labelledby="historyTitle"><div class="dialog-heading"><div><div class="eyebrow">MESSWERTVERLAUF</div><h2 id="historyTitle">Verlauf</h2></div><button id="closeHistory" aria-label="Verlauf schließen">✕</button></div>
<div class="history-toolbar"><label>Zeitraum <select id="historyRange"><option value="3600">1 Stunde</option><option value="21600">6 Stunden</option><option value="86400" selected>24 Stunden</option><option value="604800">7 Tage</option><option value="2592000">30 Tage</option></select></label><div class="history-navigation"><button id="historyPrev" aria-label="Einen Zeitraum zurück">← Zurück</button><button id="historyNow">Jetzt</button><button id="historyNext" aria-label="Einen Zeitraum vor">Vor →</button></div></div>
<div id="historyDates" class="history-dates"></div><div id="historyState" role="status" aria-live="polite"></div>
<div id="chartWrap"><svg id="historyChart" viewBox="0 0 860 320" role="img" aria-labelledby="chartTitle chartDescription"><title id="chartTitle">Temperaturverlauf</title><desc id="chartDescription"></desc></svg><div id="chartTooltip" hidden></div></div><div id="historySummary" class="hint"></div>
<details><summary>Verlaufswerte als Tabelle</summary><div class="table-scroll"><table><thead><tr><th>Zeitpunkt</th><th id="historyUnitHeading">Temperatur °C</th></tr></thead><tbody id="historyTable"></tbody></table></div></details></dialog>
<script>
'use strict';
const INITIAL = /*__INITIAL_DATA__*/null;
const $ = id => document.getElementById(id);

const statusLabels = {compressor:'Verdichter',heatingPump:'Heizkreispumpe',primaryPump:'Primärpumpe',valve:'Heizung / Warmwasser'};
const number = new Intl.NumberFormat('de-DE',{maximumFractionDigits:1});
const energyNumbers = Object.fromEntries(Object.entries({power:2,total:0,month:1}).map(([key,digits])=>[key,new Intl.NumberFormat('de-DE',{minimumFractionDigits:digits,maximumFractionDigits:digits})]));
function temperature(entry){return entry && typeof entry.value === 'number' ? number.format(entry.value)+' °C' : '—';}
function render(data){
 if(!data || !data.values) return;
 for(const key of ['primaryFlow','return','flow','water']) $(key).textContent=temperature(data.values[key]);
 $('modeBadge').textContent=data.values.mode.formatted;
 renderControls(data);
 for(const key of ['power','total','month']){
  const entry=data.energy?.[key];
  $(key).textContent=entry && Number.isFinite(entry.value)?energyNumbers[key].format(entry.value)+' '+entry.unit:'—';
  $(key+'Reason').textContent=entry?.reason || entry?.note || '';
 }
 $('monthCaption').textContent='Monatsverbrauch'+(data.energy?.month?.periodLabel?' · '+data.energy.month.periodLabel:'');
 $('statuses').replaceChildren();
 for(const [key,label] of Object.entries(statusLabels)){
  const clickable=['compressor','valve'].includes(key);
  const item=document.createElement(clickable?'button':'div');item.className='status';
  if(clickable){item.dataset.history=key;item.addEventListener('click',()=>openHistory(key));item.title='Verlauf öffnen';}item.dataset.active=String(data.values[key].value===true);
  const title=document.createElement('div');title.className='label';title.textContent=label;
  const value=document.createElement('strong');value.textContent=data.values[key].formatted;
  item.append(title,value);$('statuses').append(item);
 }
 $('sourceState').textContent=data.missing.length?'Nicht verfügbar: '+data.missing.join(', '):'IP-Symcon · '+(data.sourceCount ?? 9)+' Quellvariablen';
 $('sourceState').classList.toggle('unavailable',!!data.missing.length);
 const stamps=[...Object.values(data.values),...Object.values(data.energy || {})].map(v=>v.updated).filter(v=>v>0);
 $('updated').textContent=stamps.length?'Letztes Quellupdate: '+new Date(Math.max(...stamps)*1000).toLocaleString('de-DE'):'Noch kein Quellzeitstempel';
 scheduleTileFit();
}
function renderControls(data){
 const mode=data.controls?.mode;
 const options=mode?.options || [];
 const optionSignature=JSON.stringify(options);
 if($('modeChoices').dataset.options!==optionSignature){
  $('modeChoices').replaceChildren(...options.map(item=>{const button=document.createElement('button');button.type='button';button.dataset.value=item.value;button.textContent=item.caption || item.value;button.addEventListener('click',()=>sendControl('ChangeMode',item.value));return button;}));
  $('modeChoices').dataset.options=optionSignature;
 }
 $('modeChoices').hidden=!options.length;$('modeInput').hidden=!!options.length;$('applyMode').hidden=!!options.length;
 for(const button of $('modeChoices').querySelectorAll('button')){
  button.disabled=!mode?.enabled;button.setAttribute('aria-pressed',String(button.dataset.value===data.values.mode.value));
 }
 if(document.activeElement!==$('modeInput'))$('modeInput').value=data.values.mode.value ?? '';
 $('modeInput').disabled=!mode?.enabled;$('applyMode').disabled=!mode?.enabled;
 $('modeReason').textContent=mode?.reason || (!options.length?'Exakten Betriebsartwert der Quellvariable eingeben.':'');
 for(const key of ['roomTarget','waterTarget']){
  const control=data.controls?.[key],input=$(key+'Input');
  const min=Math.ceil(control?.min ?? 10),max=Math.floor(control?.max ?? (key==='waterTarget'?60:30));
  const range=min+':'+max;
  if(input.dataset.range!==range){
   const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Temperatur auswählen';placeholder.disabled=true;
   const options=[placeholder];
   for(let value=min;value<=max;value++){const option=document.createElement('option');option.value=String(value);option.textContent=number.format(value)+' °C';options.push(option);}
   input.replaceChildren(...options);input.dataset.range=range;
  }
  if(document.activeElement!==input){const current=data.values[key]?.value;input.value=Number.isInteger(current)&&current>=min&&current<=max?String(current):'';}
  input.disabled=!control?.enabled;$(key==='roomTarget'?'applyRoomTarget':'applyWaterTarget').disabled=!control?.enabled;
  $(key+'Reason').textContent=control?.reason || '';
  $(key+'Current').textContent='Aktueller Sollwert: '+temperature(data.values[key]);
 }
}
function sendControl(action,value){
 if(typeof requestAction!=='function'){$('feedback').textContent='Bedienung nur in der Symcon-Kachel verfügbar.';return;}
 $('feedback').textContent='Befehl wird an Symcon übergeben …';
 try{const result=requestAction(action,value);if(result && typeof result.catch==='function')result.catch(()=>{$('feedback').textContent='Befehl konnte nicht übergeben werden.';});}
 catch(e){$('feedback').textContent='Befehl konnte nicht übergeben werden.';}
 scheduleTileFit();
}
$('applyMode').addEventListener('click',()=>sendControl('ChangeMode',$('modeInput').value));
for(const [button,key,action] of [['applyRoomTarget','roomTarget','SetRoomTarget'],['applyWaterTarget','waterTarget','SetWaterTarget']])$(button).addEventListener('click',()=>{const input=$(key+'Input');if(input.value!=='' && input.reportValidity())sendControl(action,Number(input.value));});
function handleMessage(message){
 try{const data=typeof message==='string'?JSON.parse(message):message;if(data.kind==='history')receiveHistory(data);else if(data.kind==='control'){$('feedback').textContent=data.error || 'Befehl an Symcon übergeben. Rückmeldung der Anlage abwarten.';scheduleTileFit();}else render(data);}
 catch(e){$('feedback').textContent='Datenaktualisierung konnte nicht gelesen werden.';scheduleTileFit();}
}
const historyLabels={primaryFlow:'Vorlauf Primärquelle',flow:'Vorlauf Sekundär',return:'Rücklauf Sekundär',water:'Warmwasser Ist',power:'Momentanleistung · elektrisch',total:'Gesamtverbrauch · Stromzähler',month:'Monatsverbrauch',compressor:'Verdichter',valve:'Ventil Heizen / Warmwasser'};
const history={key:null,end:0,anchor:0,requestID:'',timer:null,points:[],start:0,unit:'°C',plotLeft:65};
function isStatus(){return ['compressor','valve'].includes(history.key);}
function historyFormat(value){if(isStatus())return history.key==='valve'?(value>=.5?'Warmwasser':'Heizung'):(value>=.5?'An':'Aus');return (history.unit==='°C'?number:energyNumbers[history.key]).format(value);}
function svgNode(name,attributes={},text=''){
 const node=document.createElementNS('http://www.w3.org/2000/svg',name);
 for(const [key,value] of Object.entries(attributes))node.setAttribute(key,String(value));
 if(text)node.textContent=text;return node;
}
function clearChart(){
 history.points=[];$('historyChart').replaceChildren(svgNode('title',{id:'chartTitle'},$('historyTitle').textContent),svgNode('desc',{id:'chartDescription'},'Noch keine Archivdaten angezeigt.'));
 $('historyTable').replaceChildren();$('historySummary').textContent='';$('chartTooltip').hidden=true;
}
function updateHistoryDates(){
 const span=Number($('historyRange').value);history.start=Math.max(0,history.end-span);
 const format=t=>new Date(t*1000).toLocaleString('de-DE');
 $('historyDates').textContent=format(history.start)+' – '+format(history.end);
 $('historyPrev').disabled=history.start===0;
 $('historyNext').disabled=history.end>=history.anchor;
}
function loadHistory(){
 clearTimeout(history.timer);clearChart();updateHistoryDates();
 history.requestID='h_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
 if(typeof requestAction!=='function'){$('historyState').textContent='Der Verlauf ist nur in der Symcon-Kachel verfügbar.';return;}
 $('historyState').textContent='Archivdaten werden geladen …';$('historyChart').setAttribute('aria-busy','true');
 const requestID=history.requestID;
 history.timer=setTimeout(()=>{if(requestID!==history.requestID)return;history.requestID='';$('historyChart').setAttribute('aria-busy','false');$('historyState').textContent='Keine Antwort vom Archiv. Bitte erneut laden oder Archive Control prüfen.';},15000);
 const failed=()=>{if(requestID!==history.requestID)return;clearTimeout(history.timer);history.requestID='';$('historyChart').setAttribute('aria-busy','false');$('historyState').textContent='Verlauf konnte nicht geladen werden. Bitte Archive Control prüfen.';};
 try{
  const result=requestAction('RequestHistory',JSON.stringify({requestID,key:history.key,start:history.start,end:history.end}));
  if(result && typeof result.catch==='function')result.catch(failed);
 }catch(e){failed();}
}
function openHistory(key){
 if(!Object.hasOwn(historyLabels,key))return;
 history.key=key;history.anchor=Math.floor(Date.now()/1000);history.end=history.anchor;
 $('historyTitle').textContent=historyLabels[key];
 history.unit=key==='power'?'kW':(['total','month'].includes(key)?'kWh':(isStatus()?'':'°C'));
 $('historyUnitHeading').textContent=(isStatus()?'Status':history.unit==='°C'?'Temperatur ':'Messwert ')+history.unit;
 if(!$('historyDialog').open)$('historyDialog').showModal();
 loadHistory();
}
function closeHistory(){clearTimeout(history.timer);history.requestID='';$('historyDialog').close();}
function receiveHistory(data){
 if(!$('historyDialog').open || data.requestID!==history.requestID || !history.requestID)return;
 clearTimeout(history.timer);history.requestID='';$('historyChart').setAttribute('aria-busy','false');
 if(data.error){$('historyState').textContent=data.error;return;}
 if(data.key!==history.key || data.start!==history.start || data.end!==history.end){$('historyState').textContent='Archivantwort passt nicht zum gewählten Zeitraum. Bitte erneut laden.';return;}
 history.points=(Array.isArray(data.points)?data.points:[]).filter(p=>Number.isFinite(p.time)&&Number.isFinite(p.value)&&p.time>=history.start&&p.time<=history.end).sort((a,b)=>a.time-b.time);
 if(!history.points.length){$('historyState').textContent='Keine archivierten Werte in diesem Zeitraum.';return;}
 if(data.unit)history.unit=data.unit;
 $('historyState').textContent='';drawChart(data.resolution);
}
function drawChart(resolution){
 const points=history.points;let low=Infinity,high=-Infinity;
 for(const p of points){low=Math.min(low,p.value);high=Math.max(high,p.value);}
 const bars=isStatus() || ['total','month'].includes(history.key);
 const pad=Math.max((high-low)*.12,history.unit==='°C'?.5:.01),min=isStatus()?0:bars?0:history.unit==='°C'?low-pad:Math.max(0,low-pad),max=isStatus()?1:high+pad;
 history.plotLeft=history.unit==='°C'?65:110;
 const chart=$('historyChart'),x=t=>history.plotLeft+(t-history.start)/(history.end-history.start)*(840-history.plotLeft),y=v=>265-(v-min)/(max-min)*240;
 $('chartDescription').textContent=points.length+' Archivwerte von '+historyLabels[history.key]+', Minimum '+historyFormat(low)+' '+history.unit+', Maximum '+historyFormat(high)+' '+history.unit+'.';
 for(let i=0;i<=4;i++){
  if(isStatus() && i!==0 && i!==4)continue;
  const yy=25+i*60,value=max-i*(max-min)/4;
  chart.append(svgNode('line',{x1:history.plotLeft,y1:yy,x2:840,y2:yy,class:'chart-grid'}),svgNode('text',{x:history.plotLeft-10,y:yy+4,'text-anchor':'end'},historyFormat(value)+(history.unit==='°C'?'°':'')));
 }
 for(let i=0;i<=4;i++){
  const time=history.start+(history.end-history.start)*i/4,xx=x(time);
  const date=new Date(time*1000),label=history.end-history.start>172800?date.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}):date.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  chart.append(svgNode('text',{x:xx,y:294,'text-anchor':i===0?'start':i===4?'end':'middle'},label));
 }
 if(bars){
  for(let i=0;i<points.length;i++){
   const p=points[i],cx=x(p.time),prev=i?x(points[i-1].time):history.plotLeft,next=i+1<points.length?x(points[i+1].time):840;
   if(isStatus()){
    chart.append(svgNode('rect',{x:cx,y:p.value?y(1):y(0)-2,width:Math.max(.5,x(i+1<points.length?points[i+1].time:history.end)-cx-1),height:p.value?y(0)-y(1):2,class:'chart-bar',opacity:p.value?1:.45}));
    continue;
   }
   const width=Math.max(.5,Math.min(40,Math.max(1,Math.min(cx-prev || next-cx,next-cx || cx-prev))*.8));
   chart.append(svgNode('rect',{x:Math.max(history.plotLeft,Math.min(840-width,cx-width/2)),y:y(p.value),width,height:Math.max(0,y(0)-y(p.value)),class:'chart-bar'}));
  }
 }else{
  let path=points.map((p,i)=>(i && !p.breakBefore?'L'+x(p.time).toFixed(2)+' ':'M'+x(p.time).toFixed(2)+' ')+y(p.value).toFixed(2)).join(' ');
  chart.append(svgNode('path',{d:path,class:'chart-line'}));
  if(points.length===1)chart.append(svgNode('circle',{cx:x(points[0].time),cy:y(points[0].value),r:4,class:'chart-point'}));
 }
 $('historySummary').textContent=(resolution==='monthly'?'Laufender Verbrauch je Kalendermonat':resolution==='counterHourly'?'Archivierte Zählerstände · stündliche Stützpunkte':resolution==='hourly'?'Stundenmittelwerte':'Archivierte Einzelwerte')+' · '+points.length+' Werte · Min '+historyFormat(low)+' '+history.unit+' · Max '+historyFormat(high)+' '+history.unit+(bars?(isStatus()?'. Balken zeigen archivierte Schaltzustände bis zum nächsten Wechsel.':'. Balken zeigen archivierte Zählerstände.'):'. Linien verbinden vorhandene Messpunkte; Zwischenwerte sind nicht separat gemessen.')+' Tabelle: maximal 500 Werte.';
 const rows=document.createDocumentFragment();
 for(const p of points.slice(0,500)){
  const row=document.createElement('tr'),date=document.createElement('td'),value=document.createElement('td');
  date.textContent=new Date(p.time*1000).toLocaleString('de-DE');value.textContent=historyFormat(p.value);row.append(date,value);rows.append(row);
 }
 $('historyTable').replaceChildren(rows);
}
function showHistoryPoint(event){
 if(!history.points.length)return;
 const rect=$('historyChart').getBoundingClientRect(),t=history.start+((event.clientX-rect.left)/rect.width*860-history.plotLeft)/(840-history.plotLeft)*(history.end-history.start);
 let a=0,b=history.points.length-1;
 while(a<b){const mid=Math.floor((a+b)/2);if(history.points[mid].time<t)a=mid+1;else b=mid;}
 if(isStatus() && a>0 && history.points[a].time>t)a--;
 let point=history.points[a];if(!isStatus() && a>0 && Math.abs(history.points[a-1].time-t)<Math.abs(point.time-t))point=history.points[a-1];
 $('chartTooltip').textContent=new Date(point.time*1000).toLocaleString('de-DE')+' · '+historyFormat(point.value)+' '+history.unit;$('chartTooltip').hidden=false;
}
$('historyChart').addEventListener('pointermove',showHistoryPoint);
$('historyChart').addEventListener('pointerdown',showHistoryPoint);
$('historyChart').addEventListener('pointerleave',()=>{$('chartTooltip').hidden=true;});
for(const button of document.querySelectorAll('[data-history]'))button.addEventListener('click',()=>openHistory(button.dataset.history));
$('historyRange').addEventListener('change',loadHistory);
$('historyPrev').onclick=()=>{history.end=Math.max(Number($('historyRange').value),history.end-Number($('historyRange').value));loadHistory();};
$('historyNext').onclick=()=>{history.end=Math.min(history.anchor,history.end+Number($('historyRange').value));loadHistory();};
$('historyNow').onclick=()=>{history.anchor=Math.floor(Date.now()/1000);history.end=history.anchor;loadHistory();};
$('closeHistory').onclick=closeHistory;
$('historyDialog').addEventListener('cancel',event=>{event.preventDefault();closeHistory();});

// Fit the complete overview into the HTML SDK viewport, preserving icon/text proportions.
let tileFitFrame = 0;
function scheduleTileFit(){
 if(tileFitFrame)return;
 tileFitFrame=requestAnimationFrame(()=>{tileFitFrame=0;fitTile();});
}
function fitTile(){
 const dashboard=document.querySelector('main');
 const width=document.documentElement.clientWidth,height=document.documentElement.clientHeight;
 if(width<=0 || height<=0)return;
 const fits=scale=>{
  // More layout width compensates for scaling so the final tile still fills its width.
  dashboard.style.width=(width/scale)+'px';
  return dashboard.scrollHeight*scale<=height-.5;
 };
 let scale=1;
 if(!fits(1)){
  let low=0,high=1;
  for(let i=0;i<16;i++){
   const candidate=(low+high)/2;
   if(fits(candidate))low=candidate;else high=candidate;
  }
  scale=Math.max(low,0.000001);
 }
 dashboard.style.setProperty('--tile-scale',String(scale));
 dashboard.style.removeProperty('width');
}
const tileObserver=new ResizeObserver(scheduleTileFit);
tileObserver.observe(document.documentElement);
tileObserver.observe(document.querySelector('main'));
window.addEventListener('resize',scheduleTileFit);
if(window.visualViewport)window.visualViewport.addEventListener('resize',scheduleTileFit);
if(document.fonts)document.fonts.ready.then(scheduleTileFit);
scheduleTileFit();

render(INITIAL);
</script></body></html>
