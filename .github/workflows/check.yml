name: Validate Vitocal tile
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Official Symcon stubs
        run: |
          git clone https://github.com/symcon/SymconStubs.git /tmp/SymconStubs
          git -C /tmp/SymconStubs checkout 31f2e0478eb3763236fcf44ea4144271fdeddfd5
      - name: PHP and module integration
        run: |
          php -l Vitocal222CTile/module.php
          php tests/module_test.php
      - name: Browser integration
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python tests/browser_test.py
      - run: python tests/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Vitocal222C-Kachel
          path: dist/*
