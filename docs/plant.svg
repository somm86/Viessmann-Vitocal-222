<svg xmlns="http://www.w3.org/2000/svg" class="plant" viewBox="0 0 1220 760" role="img" aria-labelledby="plantTitle plantDesc">
<title id="plantTitle">Vitocal 222-C – Funktionsschema einer Sole/Wasser-Wärmepumpe</title>
<desc id="plantDesc">Der Primärkreis nimmt Erdwärme auf und überträgt sie im Verdampfer an einen getrennten Kältemittelkreis. Dort folgen Verdichter, Verflüssiger und Expansionsventil. Im Verflüssiger wird Wärme an den ebenfalls getrennten Sekundärkreis abgegeben. Ein Umschaltventil führt Heizwasser entweder zum Heizkreis oder zum Wärmetauscher des Trinkwasserspeichers. Nur Wärme, keine Flüssigkeit, gelangt durch die Trennwände der Wärmetauscher. Dies ist ein Funktionsschema, kein Installationsplan.</desc>
<style>
.plant .scheme-panel{fill:#0a1c2c;stroke:#29465d;stroke-width:1.5}.plant .scheme-device{fill:#102c40;stroke:#4d7892;stroke-width:1.5}.plant .scheme-heading{fill:#e5f2fc;font:600 20px system-ui,sans-serif}.plant .scheme-caption{fill:#afcbdc;font:16px system-ui,sans-serif}.plant .scheme-small{fill:#8daec4;font:14px system-ui,sans-serif}.plant .scheme-stage{fill:#79a4c0;font:600 13px system-ui,sans-serif;letter-spacing:2px}.plant .circuit{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.plant .source-warm{stroke:#62d69c}.plant .source-cool{stroke:#379f9b}.plant .vapor{stroke:#6bcee6}.plant .hot-gas{stroke:#ff826c}.plant .liquid{stroke:#e8b65d}.plant .expanded{stroke:#8faff6}.plant .heating-supply{stroke:#f49b78}.plant .heating-return{stroke:#699ed7}.plant .separation{stroke:#a1b9c9;stroke-width:3}.plant .heat-transfer{stroke:#f5d893;stroke-width:2;fill:none}.plant .component{fill:#123346;stroke:#8badc2;stroke-width:2}.plant .component.active{fill:#135b44;stroke:#7de9ad}.plant .component path{stroke-width:2}.plant .scheme-arrow{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<linearGradient id="schemeWater" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d47359"/><stop offset="1" stop-color="#3c6a9c"/></linearGradient>
</defs>
<rect width="1220" height="760" rx="18" fill="#071a29"/>
<!-- Functional stages. Physical location inside the appliance is not asserted. -->
<text x="35" y="48" class="scheme-stage">01 · WÄRMEQUELLE</text>
<text x="330" y="48" class="scheme-stage">02 · WÄRMEPUMPE</text>
<text x="930" y="48" class="scheme-stage">03 · WÄRMEABGABE</text>
<path d="M35 70H270M330 70H850M930 70H1185" stroke="#25465d" stroke-width="1"/>
<rect x="305" y="115" width="555" height="580" rx="24" class="scheme-panel"/>
<text x="330" y="151" class="scheme-small">Geschlossener Kältemittelkreis</text>
<!-- PRIMARY: heat-source fluid remains on the LEFT side of the evaporator. -->
<rect x="40" y="350" width="170" height="180" rx="20" fill="#10362e" stroke="#388069" stroke-width="1.5"/>
<text x="125" y="285" class="scheme-heading" text-anchor="middle">Erdwärme</text>
<text x="125" y="309" class="scheme-caption" text-anchor="middle">Sonde / Kollektor</text>
<path d="M210 375H355" class="circuit source-warm"/>
<path d="M355 505H210" class="circuit source-cool"/>
<path d="M210 375H165V470Q165 484 152 484Q139 484 139 470V405Q139 392 126 392Q113 392 113 405V470Q113 484 100 484Q87 484 87 470V505H210" class="circuit source-cool"/>
<g id="primaryPumpSymbol" class="component"><circle cx="272" cy="375" r="17"/><path d="M263 366l18 9-18 9Z"/></g>
<text x="267" y="345" class="scheme-small" text-anchor="middle">Primärpumpe</text>
<path d="M295 370l7 5-7 5" class="scheme-arrow source-warm"/>
<path d="M272 500l-7 5 7 5" class="scheme-arrow source-cool"/>
<text x="124" y="570" class="scheme-caption" text-anchor="middle">Primärkreis · Sole</text>
<!-- EVAPORATOR: separate parallel channels with a wall and heat-transfer arrows. -->
<rect x="330" y="350" width="130" height="180" rx="16" class="scheme-device"/>
<path d="M355 375V505" class="circuit source-warm"/>
<path d="M435 505V375" class="circuit expanded"/>
<path d="M395 367V513" class="separation"/>
<path d="M373 420H417m-7-5 7 5-7 5M373 453H417m-7-5 7 5-7 5" class="heat-transfer"/>
<text x="395" y="316" class="scheme-heading" text-anchor="middle">Verdampfer</text>

<!-- REFRIGERANT: evaporator → compressor → condenser → expansion valve → evaporator. -->
<path d="M435 375H480V215H557" class="circuit vapor"/>
<path d="M613 215H680V330H725V375" class="circuit hot-gas"/>
<path d="M725 505V620H610" class="circuit liquid"/>
<path d="M560 620H435V505" class="circuit expanded"/>
<g id="compressorSymbol" class="component"><circle cx="585" cy="215" r="28"/><path d="M572 202l26 13-26 13Z"/></g>
<text x="585" y="272" class="scheme-heading" text-anchor="middle">Verdichter</text>
<path d="M585 167V184" stroke="#e5cf78" stroke-width="2"/>
<text x="585" y="109" class="scheme-small" text-anchor="middle">Elektrische Energie</text>
<path d="M588 127l-9 14h8l-4 13 11-17h-8Z" fill="#e5cf78"/>
<path d="M515 210l7 5-7 5" class="scheme-arrow vapor"/>
<path d="M675 292l5 7 5-7" class="scheme-arrow hot-gas"/>
<path d="M673 615l-7 5 7 5" class="scheme-arrow liquid"/>
<path d="M440 562l-5-7-5 7" class="scheme-arrow expanded"/>
<text x="479" y="193" class="scheme-small">Dampf</text>
<text x="701" y="193" class="scheme-small" text-anchor="end">Heißgas</text>
<text x="685" y="600" class="scheme-small" text-anchor="middle">Flüssig</text>
<g id="expansionSymbol" class="component"><path d="M560 606l25 14-25 14ZM610 606l-25 14 25 14Z"/></g>
<text x="585" y="665" class="scheme-caption" text-anchor="middle">Expansionsventil</text>
<text x="580" y="415" class="scheme-heading" text-anchor="middle">Kältemittel</text>
<text x="580" y="443" class="scheme-small" text-anchor="middle">zirkuliert im eigenen Kreis</text>
<!-- CONDENSER: refrigerant LEFT, heating water RIGHT; no hydraulic connection. -->
<rect x="700" y="350" width="130" height="180" rx="16" class="scheme-device"/>
<path d="M725 375V505" class="circuit hot-gas"/>
<path d="M805 505V375" class="circuit heating-supply"/>
<path d="M765 367V513" class="separation"/>
<path d="M743 420H787m-7-5 7 5-7 5M743 453H787m-7-5 7 5-7 5" class="heat-transfer"/>
<text x="765" y="316" class="scheme-heading" text-anchor="middle">Verflüssiger</text>

<!-- SECONDARY: selector distributes supply, common return stays outside both branches. -->
<path d="M805 375H875" class="circuit heating-supply"/>
<g id="heatingPumpSymbol" class="component"><circle cx="850" cy="375" r="16"/><path d="M842 367l16 8-16 8Z"/></g>
<text x="842" y="340" class="scheme-small" text-anchor="middle">Heizkreispumpe</text>
<path d="M900 350V260H1000M900 400V570H1000" class="circuit heating-supply"/>
<g id="valveSymbol" class="component"><path d="M875 362l25 13-25 13ZM887 350l13 25 13-25ZM887 400l13-25 13 25Z"/></g>
<text x="926" y="371" class="scheme-small">Umschaltung</text>
<text x="926" y="393" class="scheme-small">Heizen / Warmwasser</text>
<path d="M1145 320H1175V650H805V505M1145 630H1175" class="circuit heating-return"/>
<circle cx="1175" cy="630" r="5" fill="#699ed7"/>
<text x="974" y="680" class="scheme-small" text-anchor="middle">Gemeinsamer Rücklauf · Heizwasser</text>
<!-- Space heating load. -->
<rect x="1000" y="205" width="145" height="145" rx="18" class="scheme-panel"/>
<path d="M1000 260H1022V316H1038V245H1054V316H1070V245H1086V316H1102V245H1118V320H1145" class="circuit heating-supply"/>
<text x="1072" y="177" class="scheme-heading" text-anchor="middle">Heizung</text>
<text x="1072" y="379" class="scheme-small" text-anchor="middle">Heizflächen</text>
<!-- Domestic hot water is separated by its own coil from secondary heating water. -->
<rect x="1000" y="470" width="145" height="170" rx="32" fill="url(#schemeWater)" stroke="#8bb0c8" stroke-width="2"/>
<path d="M1000 570H1030C1125 578 1125 586 1030 594C1125 602 1125 610 1030 618L1145 630" fill="none" stroke="#f2c0a1" stroke-width="4"/>
<text x="1072" y="443" class="scheme-heading" text-anchor="middle">Warmwasser</text>
<text x="1072" y="505" fill="#fff0e5" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Trinkwasserspeicher</text>
<!-- Legend: distinct media, no assumed physical installation arrangement. -->
<path d="M40 725H70" class="circuit source-warm"/><text x="83" y="730" class="scheme-small">Sole</text>
<path d="M220 725H250" class="circuit vapor"/><text x="263" y="730" class="scheme-small">Kältemittel</text>
<path d="M460 725H490" class="circuit heating-supply"/><text x="503" y="730" class="scheme-small">Heizwasser</text>
<path d="M720 725H750m-7-5 7 5-7 5" class="heat-transfer"/><text x="763" y="730" class="scheme-small">Nur Wärmeübertragung</text>
</svg>
